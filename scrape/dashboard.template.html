<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telegram 频道资源精选库</title>
<style>
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#1c2430;--fg:#e6edf3;--dim:#8b949e;--acc:#3fb950;--acc2:#58a6ff;--warn:#d29922;--red:#f85149;--border:#30363d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0d1117ee,#0d1117cc);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:14px 20px}
h1{margin:0 0 4px;font-size:19px;letter-spacing:.3px}
h1 span{color:var(--acc)}
.sub{color:var(--dim);font-size:12px}
.wrap{padding:14px 20px 60px;max-width:1600px;margin:0 auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
input[type=search],select{background:var(--bg2);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:13px;outline:none}
input[type=search]{flex:1;min-width:220px}
input[type=search]:focus,select:focus{border-color:var(--acc2)}
.chip{border:1px solid var(--border);background:var(--bg2);color:var(--dim);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;user-select:none;transition:.15s}
.chip:hover{border-color:var(--acc2);color:var(--fg)}
.chip.on{background:var(--acc);color:#04160a;border-color:var(--acc);font-weight:600}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-top:6px}
.stats b{color:var(--fg)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:92px;background:var(--bg2);text-align:left;padding:8px;border-bottom:1px solid var(--border);font-size:12px;color:var(--dim);white-space:nowrap;cursor:pointer;z-index:10}
td{padding:8px;border-bottom:1px solid #21262d;vertical-align:top}
tr:hover td{background:#161b2288}
.cat{font-size:11px;padding:2px 7px;border-radius:6px;white-space:nowrap;font-weight:600}
.tg{font-size:10px;padding:1px 6px;border-radius:5px;background:#21262d;color:var(--dim);margin-right:3px;white-space:nowrap}
.dm{color:var(--acc2);text-decoration:none}
.txt{word-break:break-word}
.meta{color:var(--dim);font-size:11px;white-space:nowrap}
.meta a{color:var(--dim)}
.v{color:var(--acc);font-weight:700}
#more{margin:20px auto;display:block;background:var(--bg2);border:1px solid var(--border);color:var(--fg);padding:10px 28px;border-radius:8px;cursor:pointer;font-size:13px}
#more:hover{border-color:var(--acc)}
.empty{text-align:center;color:var(--dim);padding:40px}
</style>
</head>
<body>
<header>
  <h1>Telegram 频道资源精选库 <span id="cnt"></span></h1>
  <div class="sub" id="sub"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="搜索关键词 / 域名 / 频道，例如：免费 VPS、GitHub、AI、副业…">
    <select id="sort">
      <option value="value">按价值分</option>
      <option value="date">按时间</option>
      <option value="views">按浏览热度</option>
    </select>
    <select id="time">
      <option value="0">全部时间</option>
      <option value="30">近 30 天</option>
      <option value="90">近 90 天</option>
      <option value="180">近半年</option>
      <option value="365">近一年</option>
    </select>
  </div>
  <div class="bar" id="cats"></div>
  <div class="bar" id="tags" style="margin-top:0"></div>
</header>
<div class="wrap">
  <table>
    <thead><tr><th>日期</th><th>分类</th><th>内容</th><th>链接</th><th>标签</th><th>来源</th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">没有匹配结果</div>
  <button id="more" style="display:none">加载更多</button>
  <div class="stats" id="foot"></div>
</div>
<script>
var DATA = /*__DATA__*/;
var META = /*__META__*/;
var CATC = {"羊毛优惠":"#3fb950","项目副业":"#d29922","实用工具":"#58a6ff","开源项目":"#a371f7","AI与科技":"#39c5cf","服务器网络":"#f778ba","账号会员":"#e3b341","学习资源":"#7ee787","数码硬件":"#ffa657","资讯热点":"#8b949e","其他":"#6e7681"};
var MAXTS = 0; for (var i=0;i<DATA.length;i++){ var t=DATA[i][0]; if(t>MAXTS)MAXTS=t; }
var state={q:"",cats:{},tags:{},sort:"value",days:0,shown:0};
var CHUNK=300;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":"&quot;";});}
function b64(s){try{return btoa(unescape(encodeURIComponent(s))).slice(0,10);}catch(e){return "";}}
function daysAgo(d){ if(state.days===0)return true; var t=Date.parse(d+"T00:00:00Z"); if(isNaN(t))return true; return (Date.now()-t)<=state.days*86400000; }
function filtered(){
  var q=state.q.trim().toLowerCase();
  var cs=Object.keys(state.cats).filter(function(k){return state.cats[k];});
  var ts=Object.keys(state.tags).filter(function(k){return state.tags[k];});
  var out=[];
  for(var i=0;i<DATA.length;i++){
    var r=DATA[i];
    if(cs.length&&cs.indexOf(r[2])<0)continue;
    if(ts.length){var rt=(r[3]||"").split(",");var hit=false;for(var j=0;j<ts.length;j++)if(rt.indexOf(ts[j])>=0){hit=true;break;}if(!hit)continue;}
    if(!daysAgo(r[0]))continue;
    if(q){var hay=(r[6]+" "+r[7]+" "+r[1]+" "+r[2]+" "+r[3]).toLowerCase();if(hay.indexOf(q)<0)continue;}
    out.push(r);
  }
  out.sort(function(a,b){ if(state.sort==="date")return a[0]<b[0]?1:-1; if(state.sort==="views")return b[5]-a[5]; return b[4]-a[4]||(a[0]<b[0]?1:-1); });
  return out;
}
function rowHtml(r){
  var c=CATC[r[2]]||"#6e7681";
  var tags=(r[3]||"").split(",").filter(Boolean).slice(0,4).map(function(t){return "<span class=tg>"+esc(t)+"</span>";}).join("");
  var lk=r[7]?"<a class=dm href=\""+esc(r[7])+"\" target=_blank rel=noopener>资源链接</a><br>":"";
  return "<tr><td class=meta>"+esc(r[0])+"</td>"+
    "<td><span class=cat style=\"background:"+c+"22;color:"+c+"\">"+esc(r[2])+"</span></td>"+
    "<td class=txt>"+esc(r[6])+"</td>"+
    "<td class=meta>"+lk+"<span class=v>"+r[4]+"</span> 分</td>"+
    "<td>"+tags+"</td>"+
    "<td class=meta><a href=\""+esc(r[8])+"\" target=_blank rel=noopener>@"+esc(r[1])+"</a><br>"+(r[5]||0)+" 浏览</td></tr>";
}
var CUR=[];
function render(reset){
  if(reset){CUR=filtered();state.shown=0;document.getElementById("tb").innerHTML="";}
  var tb=document.getElementById("tb");
  var end=Math.min(state.shown+CHUNK,CUR.length);
  var html=[];
  for(var i=state.shown;i<end;i++)html.push(rowHtml(CUR[i]));
  tb.insertAdjacentHTML("beforeend",html.join(""));
  state.shown=end;
  document.getElementById("more").style.display=end<CUR.length?"block":"none";
  document.getElementById("empty").style.display=CUR.length?"none":"block";
  document.getElementById("cnt").textContent="· "+CUR.length+" 条";
  document.getElementById("more").textContent="加载更多（已显示 "+end+" / "+CUR.length+"）";
}
function buildChips(){
  var cats={},tags={};
  for(var i=0;i<DATA.length;i++){cats[DATA[i][2]]=(cats[DATA[i][2]]||0)+1;var t=(DATA[i][3]||"").split(",");for(var j=0;j<t.length;j++)if(t[j])tags[t[j]]=(tags[t[j]]||0)+1;}
  var c=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];});
  document.getElementById("cats").innerHTML="<span class=chip data-k=__all style=\"border-color:#3fb950;color:#3fb950\">全部分类</span>"+c.map(function(k){return "<span class=chip data-k=\""+esc(k)+"\">"+esc(k)+" "+cats[k]+"</span>";}).join("");
  var t=Object.keys(tags).sort(function(a,b){return tags[b]-tags[a];}).slice(0,14);
  document.getElementById("tags").innerHTML="<span style=\"color:#8b949e;font-size:12px\">标签筛选：</span>"+t.map(function(k){return "<span class=chip data-t=\""+esc(k)+"\">"+esc(k)+"</span>";}).join("");
}
document.addEventListener("click",function(e){
  var el=e.target.closest(".chip"); if(!el)return;
  if(el.dataset.k==="__all"){state.cats={};document.querySelectorAll("#cats .chip").forEach(function(x){x.classList.remove("on");});el.classList.add("on");render(true);return;}
  if(el.dataset.k){state.cats[el.dataset.k]=!state.cats[el.dataset.k];el.classList.toggle("on");render(true);return;}
  if(el.dataset.t){state.tags[el.dataset.t]=!state.tags[el.dataset.t];el.classList.toggle("on");render(true);return;}
});
var timer;document.getElementById("q").addEventListener("input",function(e){clearTimeout(timer);var v=e.target.value;timer=setTimeout(function(){state.q=v;render(true);},180);});
document.getElementById("sort").addEventListener("change",function(e){state.sort=e.target.value;render(true);});
document.getElementById("time").addEventListener("change",function(e){state.days=parseInt(e.target.value,10);render(true);});
document.getElementById("more").addEventListener("click",function(){render(false);});
buildChips();
document.getElementById("sub").textContent="数据源："+Object.keys(META.channels||{}).length+" 个 Telegram 频道 ｜ 已过滤广告/垃圾/黑产 ｜ 时间跨度 "+(META.dateRange&&META.dateRange[0]?META.dateRange[0]+" ~ "+META.dateRange[1]:"-");
document.getElementById("foot").innerHTML="原始抓取 <b>"+(META.totals.raw||0)+"</b> 条 ｜ 去重后有效 <b>"+(META.totals.clean||0)+"</b> 条 ｜ 过滤垃圾 <b>"+(META.totals.spam||0)+"</b> 条 ｜ 本页展示 <b>"+DATA.length+"</b> 条精选";
render(true);
</script>
</body>
</html>
