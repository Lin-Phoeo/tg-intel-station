name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 单元测试与集成测试
        run: npm test

      - name: 前端构建
        working-directory: app/web
        run: |
          npm ci
          npm run build
